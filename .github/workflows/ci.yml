name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Pushes to main are not cancelled: the run may be deploying to the VM.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore BlueContract.sln
      - run: dotnet format BlueContract.sln --verify-no-changes --no-restore
      - run: dotnet build BlueContract.sln -c Release --no-restore
      # Integration tests use Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test BlueContract.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      # Spec §13: line coverage of Domain + Application >= 70 %.
      - run: bash ../scripts/coverage.sh TestResults 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Images tagged by commit (sha-<short>), scanned by Trivy, pushed to GHCR from main (AUDIT-1 §13.7).
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
          - name: backup
            context: ops/backup
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/blueprocure-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          pull: true
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Report HIGH and CRITICAL (fixed upstream) in the log; fail on CRITICAL only, so a fix lands before release.
      - name: Trivy report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do docker push "$tag"; done

  # Dependency manifests (NuGet, npm) — vulnerable packages fail the build when a fix exists.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  # Continuous deployment of main to the VM (14.225.83.93, https://bluecontract.bluestar.com.vn) once every check passed.
  # The deploy key is pinned on the VM to ~/apps/blueprocure-deploy.sh, which unpacks the archive, rebuilds the
  # production stack (docker-compose.yml + docker-compose.prod.yml + the VM-only docker-compose.vm.yml) and waits until
  # every service is healthy. Secrets live only in the VM's .env.
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, images, dependencies]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: vm
      url: https://bluecontract.bluestar.com.vn
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar HEAD | gzip | \
            ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 hung@14.225.83.93 "$GITHUB_SHA"
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS https://bluecontract.bluestar.com.vn/health/ready && exit 0
            sleep 15
          done
          exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore BlueContract.sln
      - run: dotnet format BlueContract.sln --verify-no-changes --no-restore
      - run: dotnet build BlueContract.sln -c Release --no-restore
      # Integration tests use Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test BlueContract.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      # Spec §13: line coverage of Domain + Application >= 70 %.
      - run: bash ../scripts/coverage.sh TestResults 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: blueprocure/api:${{ github.sha }}
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: blueprocure/web:${{ github.sha }}

name: E2E

# Full-stack Playwright tests (spec §13, AUDIT-1 §13.7): on every pull request, nightly and on demand. Then the API is
# scaled to 2 instances and the cross-instance test (E2E #6) runs again (ADR-061).
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *' # 02:00 Vietnam time

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (without the online editor, not needed by the E2E flows)
        run: |
          cp .env.example .env
          echo "AUTH_LOGIN_RATE_LIMIT=1000" >> .env
          # api waits for postgres, storage (+ bucket), redis and gotenberg to be healthy; --wait for api and web.
          docker compose up -d --build --wait --wait-timeout 900 mailpit api web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright (one API instance)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Scale the API to 2 instances
        run: |
          docker compose up -d --wait --wait-timeout 600 --scale api=2 api
          docker compose restart web   # nginx resolves "api" to every instance when it starts
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:47080/health/ready >/dev/null && break; sleep 2; done
      - name: Playwright E2E #6 (2 API instances)
        working-directory: e2e
        run: npx playwright test tests/e2e6-scale.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: failure()
        run: docker compose logs api web

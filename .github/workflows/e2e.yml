name: E2E

# Full-stack Playwright tests (spec §13). Heavy (builds images, starts the stack), so run on demand and nightly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *' # 02:00 Vietnam time

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (without the online editor, not needed by the E2E flows)
        run: |
          cp .env.example .env
          echo "AUTH_LOGIN_RATE_LIMIT=1000" >> .env
          docker compose up -d --build postgres storage gotenberg mailpit api web
      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:47080/health/ready && exit 0
            sleep 5
          done
          docker compose logs api
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: failure()
        run: docker compose logs api

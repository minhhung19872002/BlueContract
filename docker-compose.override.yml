# Dev-only: expose internal services on the host so `dotnet run` / `npm run dev` / DB tools can reach them.
# Not used in production (deploy with: docker compose -f docker-compose.yml up -d).
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-47432}:5432"

  gotenberg:
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-47300}:3000"

  mailpit:
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-47125}:1025"

  api:
    ports:
      - "127.0.0.1:${API_PORT:-47081}:8080"

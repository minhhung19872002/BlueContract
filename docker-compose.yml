name: blueprocure

# All host ports bind to 127.0.0.1 and are configurable via .env (see .env.example).
# Docker's own log of every container (stdout): rotated, so a chatty service cannot fill the disk (AUDIT-1 §13.5).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blueprocure}
      POSTGRES_USER: ${POSTGRES_USER:-blueprocure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blueprocure_dev}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (SeaweedFS; MinIO images are no longer published — see ADR-021).
  storage:
    logging: *logging
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s","Tagging:%s"]}]}'
        "$$S3_ADMIN_ACCESS_KEY" "$$S3_ADMIN_SECRET_KEY" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=1024 -volume.max=0 -ip.bind=0.0.0.0
    # Two S3 accounts (AUDIT-1 §13.6): "admin" (creates the bucket, backups) and "app" — the API's, limited to reading,
    # writing and listing its own bucket.
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-blueprocure}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-blueprocure_s3_dev}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:-blueprocure-admin}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:-blueprocure_s3_admin_dev}
      S3_BUCKET: ${S3_BUCKET:-blueprocure}
    ports:
      - "127.0.0.1:${S3_PORT:-47900}:8333"
      - "127.0.0.1:${S3_FILER_UI_PORT:-47901}:8888"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  # Creates the bucket with the S3 admin account (the API's own account may not create buckets), then exits.
  storage-init:
    logging: *logging
    build:
      context: ./ops/backup
    image: blueprocure/backup:dev
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - aws s3api head-bucket --bucket "$$S3_BUCKET" --endpoint-url http://storage:8333 2>/dev/null || aws s3 mb "s3://$$S3_BUCKET" --endpoint-url http://storage:8333
    environment:
      S3_BUCKET: ${S3_BUCKET:-blueprocure}
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:-blueprocure-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:-blueprocure_s3_admin_dev}
      AWS_DEFAULT_REGION: us-east-1

  # Shared state of the API instances (SignalR backplane, signing sessions): lets `--scale api=N` work (ADR-061).
  redis:
    logging: *logging
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gotenberg:
    logging: *logging
    image: gotenberg/gotenberg:8.20
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-auto-start=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  onlyoffice:
    logging: *logging
    image: onlyoffice/documentserver:9.0
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice_dev_secret_change_me_32chars}
      JWT_HEADER: Authorization
      # Allow callbacks/downloads to the api container on the private docker network.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
      # Skip bundled plugin install on startup; pluginsmanager crashes and writes multi-GB WSL dumps
      PLUGINS_ENABLED: "false"
    ports:
      - "127.0.0.1:${ONLYOFFICE_PORT:-47082}:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mailpit:
    logging: *logging
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-47025}:8025"

  seq:
    logging: *logging
    image: datalust/seq:2025.2
    profiles: ["seq"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:${SEQ_PORT:-47341}:80"
    volumes:
      - seq-data:/data

  api:
    logging: *logging
    build:
      context: ./backend
    image: blueprocure/api:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    # Ready = database, storage and Gotenberg reachable (/health/ready); the first start migrates and seeds, hence the
    # long start period.
    volumes:
      # Application log files (blueprocure-<host>-<date>.log), kept across container rebuilds.
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "dotnet", "BlueContract.Api.dll", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-blueprocure};Username=${POSTGRES_USER:-blueprocure};Password=${POSTGRES_PASSWORD:-blueprocure_dev};GSS Encryption Mode=Disable
      Storage__Endpoint: storage:8333
      Redis__Configuration: ${REDIS_CONFIGURATION-redis:6379}
      # Empty: downloads go through the portal (/api/files/…). Set a public S3 domain to hand out presigned S3 URLs instead.
      Storage__PublicEndpoint: ${STORAGE_PUBLIC_ENDPOINT:-}
      Storage__AccessKey: ${S3_ACCESS_KEY:-blueprocure}
      Storage__SecretKey: ${S3_SECRET_KEY:-blueprocure_s3_dev}
      Storage__Bucket: ${S3_BUCKET:-blueprocure}
      ExternalServices__GotenbergUrl: http://gotenberg:3000
      OnlyOffice__PublicUrl: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:47082}
      OnlyOffice__InternalUrl: http://onlyoffice
      OnlyOffice__ApiBaseUrlForEditor: http://api:8080
      OnlyOffice__JwtSecret: ${ONLYOFFICE_JWT_SECRET:-onlyoffice_dev_secret_change_me_32chars}
      Auth__LoginRateLimitPerMinute: ${AUTH_LOGIN_RATE_LIMIT:-10}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}
      Seed__Demo: ${SEED_DEMO:-true}
      Seed__AllowReset: ${SEED_ALLOW_RESET:-true}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Signing__DefaultProvider: ${SIGNING_DEFAULT_PROVIDER:-MOCK}
      Signing__EnableMockProviders: ${SIGNING_ENABLE_MOCK:-true}
      Signing__TsaUrl: ${SIGNING_TSA_URL:-}
      His__Provider: ${HIS_PROVIDER:-Mock}
      His__BaseUrl: ${HIS_BASE_URL:-}
      His__ApiKey: ${HIS_API_KEY:-}
      His__AuthMode: ${HIS_AUTH_MODE:-ApiKey}
      His__Username: ${HIS_USERNAME:-}
      His__Password: ${HIS_PASSWORD:-}
      His__PullEnabled: ${HIS_PULL_ENABLED:-true}
      His__PullCron: ${HIS_PULL_CRON:-*/15 * * * *}
      # X-Forwarded-For is trusted only from the reverse proxy (the web container's docker network).
      # The compose network (pinned below): the proxies in front of the API live there.
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-${DOCKER_SUBNET:-172.28.200.0/24}}
      HisInbound__Clients__0__Name: ${HIS_INBOUND_CLIENT_NAME:-HIS}
      HisInbound__Clients__0__ApiKey: ${HIS_INBOUND_API_KEY:-his-dev-key}
      HisInbound__Clients__0__Secret: ${HIS_INBOUND_SECRET:-his-dev-secret-change-me-0123456789}
      HisInbound__AllowedIps__0: ${HIS_INBOUND_ALLOWED_IPS:-}
      HisInbound__RateLimitPerMinute: ${HIS_INBOUND_RATE_LIMIT:-120}
      HisInbound__DevEndpoints: ${HIS_DEV_ENDPOINTS:-true}
      Hangfire__DashboardEnabled: ${HANGFIRE_DASHBOARD:-true}
      Email__Host: mailpit
      Email__Port: "1025"
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:47080}
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: ${SEQ_URL:-http://seq:5341}

  # Daily backup (pg_dump + file bucket) into ./backups, Vietnam time; scripts/restore.* restores one (AUDIT-1 §13.3).
  backup:
    logging: *logging
    build:
      context: ./ops/backup
    image: blueprocure/backup:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-blueprocure}
      PGUSER: ${POSTGRES_USER:-blueprocure}
      PGPASSWORD: ${POSTGRES_PASSWORD:-blueprocure_dev}
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: ${S3_BUCKET:-blueprocure}
      # Backups read and restore the whole bucket: the admin account.
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:-blueprocure-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:-blueprocure_s3_admin_dev}
      AWS_DEFAULT_REGION: us-east-1
      BACKUP_TIME: ${BACKUP_TIME-01:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups

  web:
    logging: *logging
    build:
      context: ./frontend
    image: blueprocure/web:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${WEB_PORT:-47080}:8080"

volumes:
  api-logs:
  postgres-data:
  storage-data:
  onlyoffice-data:
  onlyoffice-logs:
  seq-data:

# Fixed subnet, so the API knows which addresses are its own proxies (X-Forwarded-*). Docker would otherwise pick any
# free range (e.g. 192.168.x when 172.16/12 is used up) and the forwarded scheme / client IP would be ignored.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.200.0/24}

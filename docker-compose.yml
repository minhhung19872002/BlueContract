name: blueprocure

# All host ports bind to 127.0.0.1 and are configurable via .env (see .env.example).
services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blueprocure}
      POSTGRES_USER: ${POSTGRES_USER:-blueprocure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blueprocure_dev}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-47900}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-47901}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8.20
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-auto-start=true

  onlyoffice:
    image: onlyoffice/documentserver:9.0
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice_dev_secret_change_me_32chars}
      JWT_HEADER: Authorization
      # Allow callbacks/downloads to the api container on the private docker network.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    ports:
      - "127.0.0.1:${ONLYOFFICE_PORT:-47082}:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-47025}:8025"

  seq:
    image: datalust/seq:2025.2
    profiles: ["seq"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:${SEQ_PORT:-47341}:80"
    volumes:
      - seq-data:/data

  api:
    build:
      context: ./backend
    image: blueprocure/api:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-blueprocure};Username=${POSTGRES_USER:-blueprocure};Password=${POSTGRES_PASSWORD:-blueprocure_dev};GSS Encryption Mode=Disable
      Storage__Endpoint: minio:9000
      Storage__PublicEndpoint: localhost:${MINIO_API_PORT:-47900}
      Storage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      Storage__Bucket: ${MINIO_BUCKET:-blueprocure}
      ExternalServices__GotenbergUrl: http://gotenberg:3000
      ExternalServices__OnlyOfficeInternalUrl: http://onlyoffice
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}
      Seed__Demo: ${SEED_DEMO:-true}
      Seed__AllowReset: ${SEED_ALLOW_RESET:-true}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Email__Host: mailpit
      Email__Port: "1025"
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:47080}
      Serilog__WriteTo__2__Name: Seq
      Serilog__WriteTo__2__Args__serverUrl: ${SEQ_URL:-http://seq:5341}

  web:
    build:
      context: ./frontend
    image: blueprocure/web:dev
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-47080}:8080"

volumes:
  postgres-data:
  minio-data:
  onlyoffice-data:
  onlyoffice-logs:
  seq-data:

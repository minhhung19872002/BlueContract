upstream blueprocure_api {
    server api:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 50m;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # API, docs, health, background-job dashboard and realtime hubs go to the backend.
    location ~ ^/(api|health|docs|openapi|scalar|hangfire|hubs)(/|$) {
        proxy_pass http://blueprocure_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ES module workers (pdf.js) must be served as JavaScript; nginx's default mime.types lacks .mjs.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

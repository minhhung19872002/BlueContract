# Security headers (spec §11, OWASP). Included at server level and again in every location that sets its own add_header,
# because nginx drops inherited add_header directives as soon as a location defines one.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The portal may only be framed by itself (clickjacking); the ONLYOFFICE editor is framed *by* the portal, not the reverse.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
add_header Cross-Origin-Opener-Policy same-origin always;
